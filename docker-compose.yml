name: tiki-absa-airflow

# Reuse the deployed Airflow project's services/volumes instead of creating copies.
include:
  - path: docker-compose.airflow.yml

services:
  api:
    image: tiki-absa-api:local
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file:
      - .env.docker
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-tiki_kb_test}
      EMBEDDING_DEVICE: cpu
      HF_HOME: /opt/hf-cache
      HF_HUB_CACHE: /opt/hf-cache/hub
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      API_LOG_INTERACTIONS: "true"
      API_LOG_FILE: logs/interactions.jsonl
      API_ENABLE_METRICS: "true"
    volumes:
      - ./models:/opt/tiki/models:ro
      - ./logs:/opt/tiki/logs
      - type: bind
        source: ${HF_HUB_CACHE_HOST:?Run setup first}
        target: /opt/hf-cache/hub
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    networks: [airflow]
    healthcheck:
      test: [CMD, /opt/tiki-venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=5)"]
      interval: 20s
      timeout: 10s
      start_period: 180s
      retries: 12
    restart: unless-stopped

  ui:
    image: tiki-absa-ui:local
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      CHAINLIT_NO_TELEMETRY: "true"
    ports:
      - "127.0.0.1:${UI_HOST_PORT:-8001}:8001"
    networks: [airflow]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8001/',timeout=5)"]
      interval: 20s
      timeout: 10s
      start_period: 60s
      retries: 8
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.10.0
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus', '--storage.tsdb.retention.time=15d']
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090'
    networks: [airflow, loadtest]
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://localhost:9090/-/ready]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run scripts/monitoring.ps1 setup}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000'
    networks: [airflow]
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --quiet, --tries=1, --spider, http://localhost:3000/api/health]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api-loadtest:
    image: tiki-absa-api:local
    profiles: [loadtest]
    command: [/opt/tiki-venv/bin/python, -m, uvicorn, source.chatbot.loadtest_api:app, --host, 0.0.0.0, --port, '8000', --workers, '1']
    environment:
      TIKI_LOADTEST_MODE: synthetic
      QDRANT_COLLECTION: synthetic_fixture
      API_ENABLE_METRICS: 'true'
      API_LOG_INTERACTIONS: 'false'
    networks: [loadtest]
    healthcheck:
      test: [CMD, /opt/tiki-venv/bin/python, -c, "import urllib.request; r=urllib.request.urlopen('http://localhost:8000/health'); assert r.headers['X-Tiki-Loadtest']=='synthetic'"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: 'no'

  locust:
    image: locustio/locust:2.47.0
    profiles: [loadtest]
    command: [-f, /mnt/locust/load_test.py, --host, 'http://api-loadtest:8000', --web-host, 0.0.0.0, --web-port, '8089', --class-picker]
    volumes:
      - ./tests/load_test.py:/mnt/locust/load_test.py:ro
      - ./tests/loadtest_support.py:/mnt/locust/loadtest_support.py:ro
      - ./tests/loadtest_warmup.py:/mnt/locust/loadtest_warmup.py:ro
      - ./reports/loadtest:/reports
    environment:
      ALLOW_LIVE_LLM: '0'
    ports:
      - '127.0.0.1:${LOCUST_HOST_PORT:-8089}:8089'
    networks: [airflow, loadtest]
    depends_on:
      api-loadtest:
        condition: service_healthy

networks:
  loadtest:
    internal: true

volumes:
  prometheus_data:
  grafana_data:
